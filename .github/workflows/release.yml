name: Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build and release APK
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install pinned NDK and SDK packages
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMANAGER" ] || SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f 2>/dev/null | sort | head -1)"
          echo "sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "ndk;27.3.13750724" "platforms;android-34" "build-tools;34.0.0"
          echo "sdk.dir=${ANDROID_HOME}" >> local.properties

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq zstd python3 python3-yaml

      - name: Build APK (full native build)
        run: bash tools/build_local.sh

      - name: Sign with release key (optional)
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.DYSTEAM_RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.DYSTEAM_RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.DYSTEAM_RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.DYSTEAM_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          if [ -z "${RELEASE_KEYSTORE_BASE64:-}" ]; then
            echo "No release keystore secret set; keeping the AOSP testkey signature."
            exit 0
          fi
          ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "${RELEASE_KEYSTORE_BASE64}" | base64 -d > "$RUNNER_TEMP/release.jks"
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$BUILD_TOOLS/zipalign" -p -f 4 "$APK" "$APK.aligned"
          "$BUILD_TOOLS/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-pass "pass:${RELEASE_STORE_PASSWORD}" --ks-key-alias "${RELEASE_KEY_ALIAS}" --key-pass "pass:${RELEASE_KEY_PASSWORD}" --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true --out "$APK" "$APK.aligned"
          rm -f "$APK.aligned" "$APK.idsig"
          "$BUILD_TOOLS/apksigner" verify --min-sdk-version 26 "$APK" > /dev/null
          echo "Re-signed with release key (alias: ${RELEASE_KEY_ALIAS})."

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
